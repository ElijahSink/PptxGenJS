name: Publish to npm

# Authentication is npm Trusted Publishing (OIDC) - there is no NPM_TOKEN.
# npmjs.com must have a Trusted Publisher configured for this package pointing at
# this repo and this workflow filename; see PUBLISHING.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, validate and pack only - do not publish'
        type: boolean
        default: true

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22' # trusted publishing needs >= 22.14.0
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # npm advises against caching in release builds

      # Trusted publishing needs npm >= 11.5.1, which is newer than the CLI
      # bundled with Node 22.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify versions agree
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRC=$(node -p "require('fs').readFileSync('src/pptxgen.ts','utf8').match(/const VERSION = '([^']+)'/)[1]")
          if [ "$SRC" != "$PKG" ]; then
            echo "::error::src/pptxgen.ts VERSION is $SRC but package.json is $PKG"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match package.json version $PKG"
              exit 1
            fi
          fi
          echo "version $PKG is consistent"

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Always builds from source, so the published tarball never depends on
      # whatever happens to be committed under dist/
      - name: Build dist
        run: npm run dist

      - name: Pack and show contents
        run: npm pack --dry-run

      # No --provenance flag: trusted publishing attaches provenance automatically.
      - name: Publish
        if: github.ref_type == 'tag' && github.event.inputs.dry_run != 'true'
        run: npm publish
