name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, validate and pack only - do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify versions agree
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRC=$(node -p "require('fs').readFileSync('src/pptxgen.ts','utf8').match(/const VERSION = '([^']+)'/)[1]")
          if [ "$SRC" != "$PKG" ]; then
            echo "::error::src/pptxgen.ts VERSION is $SRC but package.json is $PKG"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match package.json version $PKG"
              exit 1
            fi
          fi
          echo "version $PKG is consistent"

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Always builds from source, so the published tarball never depends on
      # whatever happens to be committed under dist/
      - name: Build dist
        run: npm run dist

      - name: Pack and show contents
        run: npm pack --dry-run

      - name: Publish
        if: github.ref_type == 'tag' && github.event.inputs.dry_run != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
